<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Iconos -->
    <link rel="icon" href="./assets/icons/favicon.ico" sizes="any">
    <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="./assets/icons/favicon.png" type="image/png">

    <link rel="stylesheet" href="./styles/profile.css">
    <link rel="stylesheet" href="./styles/output.css">
    <script type="module" src="./js/app.js" defer></script>
</head>

<body class="h-screen flex flex-col">
    <header class="w-full bg-[#1e1e4a] text-white">
        <div class="container mx-auto px-4 pb-4 pt-2">

            <div class="flex flex-col md:flex-row justify-between items-center gap-4">

                <!-- Botones -->
                <div id="header-buttons-div" class="flex space-x-4">
                    <a href="./home.html"
                        class="bg-[#2f2f88] hover:bg-[#282875] transition-colors px-4 py-1.5 font-medium rounded-sm">
                        INICIO
                    </a>
                    <a href="./profile.html"
                        class="bg-[#ffb847] hover:bg-[#e0a03a] transition-colors px-4 py-1.5 font-medium rounded-sm">
                        PERFIL
                    </a>
                    <a href="./upload-product.html"
                        class="bg-[#ff0000] hover:bg-[#d12626] transition-colors px-4 py-1.5 font-medium rounded-sm">
                        SUBIR PRODUCTO
                    </a>
                </div>

                <!-- Info. usuario -->
                <div class="flex items-center space-x-3">
                    <div class="text-right">
                        <p id="header-username" class="text-sm">Nombre de usuario</p>
                        <p id="header-role" class="text-xs text-gray-300">Admin/Usuario</p>
                    </div>
                    <div class="h-10 w-10 rounded-full bg-white overflow-hidden">
                        <img id="header-profile-image" src="./assets/icons/profilePlaceholder.svg" alt="User avatar"
                            width="40" height="40" class="object-cover" />
                    </div>
                </div>
            </div>

            <!-- Barra busqueda -->
            <form class="flex mt-2 gap-4">
                <input type="text" placeholder="Buscar productos..."
                    class="flex-1 bg-gray-200 text-gray-800 px-4 py-2 focus:outline-none rounded-sm" />
                <input type="submit"
                    class="bg-[#2f2f88] hover:bg-[#282875] transition-colors px-4 py-2 flex items-center text-white rounded-sm">
            </form>
        </div>
    </header>

    <main id="profile-main" class="flex-1 w-full">
        <div class="flex w-full h-full justify-evenly">
            <!-- Primer div: 2 labels, 2 inputs y botón submit -->
            <div class="flex-[55] w-1/2 h-full p-6 flex flex-col justify-center items-center gap-4">
                <h1 class="text-white text-4xl">MODIFICAR DATOS</h1>

                <form id="profile-form" class="w-3/4 h-5/6 flex flex-col justify-evenly items-center gap-6">
                    <!-- Grupo: Usuario -->
                    <div class="w-full flex flex-col items-center gap-2">
                        <label for="profile-username" class="w-3/4 text-left text-white text-xl">NOMBRE DE
                            USUARIO</label>
                        <input id="profile-username" type="text"
                            class="w-3/4 h-14 text-white bg-black bg-opacity-80 focus:bg-opacity-100 text-2xl rounded-lg px-4"
                            maxlength="50" />
                    </div>

                    <!-- Grupo: Contraseña -->
                    <div class="w-full flex flex-col items-center gap-2">
                        <label for="profile-password" class="w-3/4 text-left text-white text-xl">CONTRASEÑA</label>
                        <input id="profile-password" type="password"
                            class="w-3/4 h-14 text-white bg-black bg-opacity-80 focus:bg-opacity-100 text-2xl rounded-lg px-4"
                            placeholder="Contraseña" />
                    </div>

                    <!-- Grupo: Confirmar contraseña -->
                    <div class="w-full flex flex-col items-center gap-2">
                        <label for="profile-password" class="w-3/4 text-left text-white text-xl">REPITE TU CONTRASEÑA</label>
                        <input id="profile-confirm-password" type="password"
                            class="w-3/4 h-14 text-white bg-black bg-opacity-80 focus:bg-opacity-100 text-2xl rounded-lg px-4"
                            placeholder="Contraseña" />
                    </div>

                    <!-- Botón -->
                    <input id="profile-submit-button" type="submit"
                        class="mt-4 bg-[#ffb847] font-extrabold text-white px-6 py-3 rounded hover:bg-[#ffb8de] hover:text-black transition text-xl"
                        value="Enviar" />
                </form>
            </div>

            <!-- Segundo div: formulario imagen de perfil -->
            <div class="flex-[45] w-1/2 h-full p-6 flex flex-col justify-center items-center gap-4">
                <h1 class="text-white text-4xl">SUBIR IMAGEN DE PERFIL</h1>

                <form id="profile-image-form" class="w-11/12 h-5/6 flex flex-col justify-evenly items-center gap-6">

                    <!-- Contenedor imagen con padding y estilo -->
                    <img id="preview" src="" alt="Vista previa"
                        class="hidden w-8/12 aspect-square object-cover rounded-full border-2 border-white" />


                    <!-- Boton para elegir archivo -->
                    <input id="profile-file-input" type="file" accept="image/*"
                        class="file:bg-blue-700 file:text-white file:font-bold file:px-4 file:py-2 file:rounded file:hover:bg-blue-800 file:transition text-white" />


                    <!-- Botones de acción -->
                    <div id="image-buttons" class="hidden flex gap-4">
                        <input id="profile-image-submit-button" type="submit"
                            class="bg-[#ffb847] font-bold text-white px-6 py-3 rounded hover:bg-[#ffb8de] hover:text-black transition text-xl"
                            value="Confirmar" />

                        <button type="button" id="profile-remove-image-button"
                            class="bg-red-600 font-bold text-white px-6 py-3 rounded hover:bg-gray-700 transition text-xl">
                            Eliminar
                        </button>
                    </div>

                </form>
            </div>


        </div>
    </main>


</body>

</html>
