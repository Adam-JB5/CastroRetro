<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styles/output.css">
    <script type="module" src="./js/app.js" defer></script>
</head>
<!-- <style>
    html,
    body {
        height: 100%;
    }
</style> -->

<body class="h-screen flex flex-col">
    <header class="w-full bg-[#1e1e4a] text-white">
        <div class="container mx-auto px-4 py-4">

            <div class="flex flex-col md:flex-row justify-between items-center gap-4">

                <!-- Botones -->
                <div class="flex space-x-4">
                    <a href="./" class="bg-[#1a1a2e] hover:bg-[#2a2a4e] transition-colors px-6 py-2 font-medium">
                        INICIO
                    </a>
                    <a href="./profile.html"
                        class="bg-[#1a1a2e] hover:bg-[#2a2a4e] transition-colors px-6 py-2 font-medium">
                        PERFIL
                    </a>
                    <a href="./upload-product.html"
                        class="bg-[#1a1a2e] hover:bg-[#2a2a4e] transition-colors px-6 py-2 font-medium">
                        SUBIR PRODUCTO
                    </a>
                </div>

                <!-- Info. usuario -->
                <div class="flex items-center space-x-3">
                    <div class="text-right">
                        <p id="header-username" class="text-sm">Nombre de usuario</p>
                        <p id="header-role" class="text-xs text-gray-300">Admin/Usuario</p>
                    </div>
                    <div class="h-10 w-10 rounded-full bg-white overflow-hidden">
                        <img src="/placeholder.svg" alt="User avatar" width="40" height="40" class="object-cover" />
                    </div>
                </div>
            </div>

            <!-- Barra busqueda -->
            <form class="flex mt-4 gap-4">
                <input type="text" placeholder="Buscar productos..."
                    class="flex-1 bg-gray-200 text-gray-800 px-4 py-2 focus:outline-none" />
                <input type="submit"
                    class="bg-[#1a1a2e] hover:bg-[#2a2a4e] transition-colors px-4 py-2 flex items-center text-white">
            </form>
        </div>
    </header>

    <main class="flex-1 w-full">
        <div class="flex w-full h-full justify-evenly">
            <!-- Primer div: 2 labels, 2 inputs y botón submit -->
            <div class="bg-red-300 flex-1 w-1/2 h-full p-6 flex flex-col justify-center gap-4">
                <form>
                    <label for="input1" class="block font-semibold">Etiqueta 1</label>
                    <input id="input1" type="text" class="w-full px-3 py-2 border rounded" />

                    <label for="input2" class="block font-semibold">Etiqueta 2</label>
                    <input id="input2" type="text" class="w-full px-3 py-2 border rounded" />

                    <button type="submit"
                        class="mt-4 bg-blue-700 text-white px-4 py-2 rounded hover:bg-blue-800 transition">
                        Enviar
                    </button>
                </form>
            </div>

            <!-- Segundo div: formulario para cambiar imagen de perfil -->
            <div class="bg-blue-500 flex-1 w-1/2 h-full p-6 flex flex-col justify-center">
                <form>
                    <label for="profileImage" class="block text-white font-semibold mb-2">Cambiar imagen de
                        perfil</label>
                    <input id="profileImage" type="file" accept="image/*" class="mb-4" />
                    <button type="submit" class="bg-red-700 text-white px-4 py-2 rounded hover:bg-red-800 transition">
                        Subir imagen
                    </button>
                </form>
            </div>
        </div>
    </main>


</body>

</html>
