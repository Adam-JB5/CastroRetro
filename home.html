<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Iconos -->
    <link rel="icon" href="./assets/icons/favicon.ico" sizes="any">
    <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="./assets/icons/favicon.png" type="image/png">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://getbootstrap.com/docs/5.3/assets/css/docs.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="./styles/home.css">
    <link rel="stylesheet" href="./styles/output.css">
    <script type="module" src="./js/app.js" defer></script>


</head>

<body class="h-screen flex flex-col">
    <header class="w-full bg-[#1e1e4a] text-white">
        <div class="container mx-auto px-4 pb-4 pt-2">

            <div class="flex flex-col md:flex-row justify-between items-center gap-4">

                <!-- Botones -->
                <div id="header-buttons-div" class="flex space-x-4">
                    <a href="./home.html"
                        class="bg-[#2f2f88] hover:bg-[#282875] transition-colors px-4 py-1.5 font-medium rounded-sm">
                        INICIO
                    </a>
                    <a href="./profile.html"
                        class="bg-[#ffb847] hover:bg-[#e0a03a] transition-colors px-4 py-1.5 font-medium rounded-sm">
                        PERFIL
                    </a>
                    <a href="./upload-product.html"
                        class="bg-[#ff0000] hover:bg-[#d12626] transition-colors px-4 py-1.5 font-medium rounded-sm">
                        SUBIR PRODUCTO
                    </a>
                    <a href="./my-products.html"
                        class="bg-[#ffb8de] hover:bg-[#d27baa] transition-colors px-4 py-1.5 font-medium rounded-sm">
                        MIS PRODUCTOS
                    </a>
                </div>

                <!-- Info. usuario -->
                <div class="flex items-center space-x-3">
                    <div class="text-right">
                        <p id="header-username" class="text-sm">Nombre de usuario</p>
                        <p id="header-role" class="text-xs text-gray-300">Admin/Usuario</p>
                    </div>
                    <div class="h-10 w-10 rounded-full bg-white overflow-hidden">
                        <img id="header-profile-image" src="./assets/icons/profilePlaceholder.svg" alt="User avatar"
                            width="40" height="40" class="object-cover" />
                    </div>
                </div>
            </div>

            <!-- Barra busqueda -->
            <form class="flex mt-2 gap-4">
                <input type="text" placeholder="Buscar productos..."
                    class="flex-1 bg-gray-200 text-gray-800 px-4 py-2 focus:outline-none rounded-sm" />
                <input type="submit"
                    class="bg-[#2f2f88] hover:bg-[#282875] transition-colors px-4 py-2 flex items-center text-white rounded-sm">
            </form>
        </div>
    </header>

    <main class="flex flex-col items-center justify-center bg-[#1b1d36] space-y-12 p-8">

        <!-- Carrusel ultimos productos -->
        <h1 class="text-white text-7xl">ÚLTIMOS PRODUCTOS</h1>
        <div class="w-full rounded-xl text-center">

            <div id="carouselExample" class="carousel slide bg-transparent" data-bs-ride="carousel">
                <!-- Indicadores -->
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="0" class="active"
                        aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="1"
                        aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="2"
                        aria-label="Slide 3"></button>
                </div>

                <!-- Items del carrusel -->
                <div class="carousel-inner">
                    <div class="carousel-item active"></div>
                    <div class="carousel-item"></div>
                    <div class="carousel-item"></div>
                </div>

                <!-- Control anterior/siguiente -->
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExample"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>

        <!-- Cateogorias -->
        <h1 class="text-white text-7xl">CATEGORÍAS</h1>
        <div class="w-10/12 flex justify-between text-white text-xl font-semibold">

            <a href="./category.html?categoria=Consola" id="home-category-console"
                class="home-category w-2/12 bg-transparent flex flex-col justify-around items-center px-6 py-4 rounded-lg">
                <img class="w-11/12 h-auto" src="./assets/icons/gameboy.svg" alt="">
                <h3>CONSOLAS</h3>
            </a>

            <a href="./category.html?categoria=Juego" id="home-category-videogame"
                class="home-category w-2/12 bg-transparent flex flex-col justify-around items-center px-6 py-4 rounded-lg">
                <img class="w-11/12 h-auto" src="./assets/icons/cartridge.svg" alt="">
                <h3>VIDEOJUEGOS</h3>
            </a>

            <a href="./category.html?categoria=Accesorio" id="home-category-accesory"
                class="home-category w-2/12 bg-transparent flex flex-col justify-around items-center px-6 py-4 rounded-lg">
                <img class="w-11/12 h-auto" src="./assets/icons/controller.svg" alt="">
                <h3>ACCESORIOS</h3>
            </a>

            <a href="./category.html?categoria=Otro" id="home-category-other"
                class="home-category w-2/12 bg-transparent flex flex-col justify-around items-center px-6 py-4 rounded-lg">
                <img class="w-11/12 h-auto" src="./assets/icons/other.svg" alt="">
                <h3>OTROS</h3>
            </a>
        </div>

        <h1 class="text-white text-7xl">PRODUCTOS</h1>
        <div id="home-div-productos" class="w-11/12 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8 text-white text-xl font-semibold">
        </div>

    </main>
</body>

</html>
