<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./styles/login.css">
    <link rel="stylesheet" href="./styles/output.css">
    <script type="module" src="./js/app.js"></script>
</head>
<body class="text-center">
    <div id="login-screen" class="h-screen w-screen flex items-center justify-center">
        <div id="login-content" class="h-3/4 w-3/5 flex flex-col items-center justify-between">
            
            <div id="login-title">
                <h1 class="text-8xl text-white">CASTRO RETRO</h1>
            </div>

            <div id="login-sign-up-link" class="my-4">
                <a href="./register.html" class="text-gray-400 underline hover:text-white"><p>¿No tienes una cuenta? Regístrate aquí</p></a>
            </div>

            <form id="login-form" class="w-2/3 h-full bg-[#282c63d1] flex flex-col items-center pt-7 rounded-2xl">
                <input class="w-3/4 h-20 text-white bg-black bg-opacity-80 focus:bg-opacity-100 text-3xl rounded-lg mt-10 mb-36 px-4" id="login-email" type="email" placeholder="Email">
                <input class="w-3/4 h-20 text-white bg-black bg-opacity-80 focus:bg-opacity-100 text-3xl rounded-lg px-4" id="login-password" type="password" placeholder="Contraseña">

                <div class="flex-grow"></div>

                <input id="login-submit-button" type="submit" value="INICIAR SESIÓN" class="h-20 bg-black w-full text-white text-3xl font-bold rounded-b-2xl hover:text-black">
            </form>
        </div>
    </div>
</body>
</html>
